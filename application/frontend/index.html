<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aether Tower — rezerwacja stanowisk pracy</title>
  <meta name="description" content="Aether Tower OS: rezerwacja 15 000 stanowisk pracy na 100 piętrach wieżowca biurowego Aether Tower.">
  <meta name="theme-color" content="#F2EEE5">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Schibsted+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">

    <!-- ===== MASTHEAD ===== -->
    <header class="topbar">
      <div class="brand">
        <svg class="brand__logo" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M4 28h24M8 28V14h16v14M12 14V8h8v6M16 8V3" />
        </svg>
        <div class="brand__text">
          <h1 class="brand__title">Aether Tower <span>OS</span></h1>
          <span class="brand__sub">Rezerwacja stanowisk · 100 pięter · v1.0.1</span>
        </div>
      </div>

      <div class="crumb mono" id="crumb" aria-live="polite">FL-—</div>

      <div class="topbar__controls">
        <label class="field" for="date-input">
          <span class="field__label">Data</span>
          <input type="date" id="date-input" class="field__input mono">
        </label>
        <label class="field" for="user-select">
          <span class="field__label">Pracownik</span>
          <select id="user-select" class="field__input" aria-label="Pracownik"></select>
        </label>
        <div class="clock" aria-label="Aktualny czas">
          <span class="clock__time mono" id="clock-time">--:--:--</span>
          <span class="clock__date" id="clock-date">----</span>
        </div>
        <div class="link" id="link" title="Połączenie z reservation-service">
          <i class="led" aria-hidden="true"></i>
          <span id="link-label">Łączenie</span>
        </div>
      </div>
    </header>

    <!-- ===== UKŁAD: indeks pięter | plan | szczegóły ===== -->
    <main class="layout" id="layout">

      <!-- Indeks pięter -->
      <aside class="panel panel--floors" aria-label="Selektor pięter">
        <div class="panel__head">
          <div>
            <h2 class="panel__title">Piętra</h2>
            <p class="panel__sub" id="tower-stat">Wieża · ładowanie…</p>
          </div>
          <span class="chip mono" id="floor-count">100</span>
        </div>

        <div class="tower-bar" aria-hidden="true"><span id="tower-bar-fill"></span></div>

        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="floor-search" type="search" inputmode="numeric" placeholder="Przejdź do piętra (1–100)" autocomplete="off" aria-label="Szukaj piętra">
        </div>

        <ul class="floor-list" id="floor-list" role="listbox" aria-label="Lista pięter"></ul>

        <div class="mine">
          <div class="mine__head">
            <span class="eyebrow">Moje rezerwacje</span>
            <span class="chip chip--accent mono" id="mine-count">0</span>
          </div>
          <ul class="mine__list" id="mine-list"></ul>
        </div>
      </aside>

      <!-- Plan piętra -->
      <section class="panel panel--map" aria-label="Plan piętra">
        <div class="map-head">
          <div class="map-head__title">
            <span class="eyebrow" id="map-eyebrow">Plan piętra</span>
            <h2 id="map-title">Wybierz piętro</h2>
          </div>
          <div class="stats" id="map-stats"></div>
        </div>

        <div class="legend" aria-label="Legenda">
          <span><i class="dot dot--free"></i>Wolne</span>
          <span><i class="dot dot--occupied"></i>Zajęte</span>
          <span><i class="dot dot--maintenance"></i>Konserwacja</span>
          <span><i class="dot dot--selected"></i>Zaznaczone</span>
          <span><i class="dot dot--mine"></i>Moje</span>
        </div>

        <div class="map-body" id="map-body"></div>
      </section>

      <!-- Szczegóły biurka -->
      <div class="drawer-wrap" id="drawer-wrap">
        <aside class="panel drawer" id="drawer" aria-label="Szczegóły stanowiska" aria-hidden="true">
          <div class="panel__head">
            <div>
              <span class="eyebrow">Karta stanowiska</span>
              <h2 class="panel__title">Stanowisko</h2>
            </div>
            <button type="button" class="icon-btn" id="drawer-close" aria-label="Zamknij panel szczegółów">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </div>
          <div class="drawer__body" id="drawer-body"></div>
        </aside>
      </div>
    </main>

    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
