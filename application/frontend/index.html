<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aether Tower OS — Command Console NOC | Rezerwacja stanowisk</title>
  <meta name="description" content="Aether Tower OS: konsola NOC do rezerwacji 15 000 stanowisk pracy na 100 piętrach wieżowca biurowego Aether Tower.">
  <meta name="theme-color" content="#0A0E16">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">

    <!-- ===== TOP BAR ===== -->
    <header class="topbar">
      <div class="brand">
        <svg class="brand__logo" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#00E5FF"/>
              <stop offset="1" stop-color="#00E676"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="60" height="60" rx="16" fill="#0F131C" stroke="#1E293B" stroke-width="2"/>
          <path d="M32 11 16 53h7.5l3.2-9h10.6l3.2 9H48L32 11Zm0 16.5L36 38.5h-8L32 27.5Z" fill="url(#logo-grad)"/>
        </svg>
        <div class="brand__text">
          <h1 class="brand__title">AETHER TOWER <span>OS</span></h1>
          <span class="brand__sub mono">COMMAND CONSOLE // NOC</span>
        </div>
      </div>

      <div class="crumb mono" id="crumb" aria-live="polite">FL-—</div>

      <div class="topbar__controls">
        <label class="field" for="date-input">
          <span class="field__label mono">DATA</span>
          <input type="date" id="date-input" class="field__input mono">
        </label>
        <label class="field" for="user-select">
          <span class="field__label mono">OPERATOR</span>
          <select id="user-select" class="field__input mono" aria-label="Operator"></select>
        </label>
        <div class="clock" aria-label="Aktualny czas">
          <span class="clock__time mono" id="clock-time">--:--:--</span>
          <span class="clock__date mono" id="clock-date">----</span>
        </div>
        <div class="link" id="link" title="Połączenie z reservation-service">
          <i class="led" aria-hidden="true"></i>
          <span class="mono" id="link-label">LINK</span>
        </div>
      </div>
    </header>

    <!-- ===== 3-PANEL LAYOUT ===== -->
    <main class="layout" id="layout">

      <!-- Panel lewy: selektor pięter -->
      <aside class="panel panel--floors" aria-label="Selektor pięter">
        <div class="panel__head">
          <div>
            <h2 class="panel__title">PIĘTRA</h2>
            <p class="panel__sub mono" id="tower-stat">WIEŻA · ładowanie…</p>
          </div>
          <span class="chip mono" id="floor-count">100</span>
        </div>

        <div class="tower-bar" aria-hidden="true"><span id="tower-bar-fill"></span></div>

        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="floor-search" class="mono" type="search" inputmode="numeric" placeholder="Skocz do piętra (1–100)" autocomplete="off" aria-label="Szukaj piętra">
        </div>

        <ul class="floor-list" id="floor-list" role="listbox" aria-label="Lista pięter"></ul>

        <div class="mine">
          <div class="mine__head">
            <span class="eyebrow mono">MOJE REZERWACJE</span>
            <span class="chip chip--cyan mono" id="mine-count">0</span>
          </div>
          <ul class="mine__list" id="mine-list"></ul>
        </div>
      </aside>

      <!-- Panel centralny: mapa piętra -->
      <section class="panel panel--map" aria-label="Mapa piętra">
        <div class="map-head">
          <div class="map-head__title">
            <span class="eyebrow mono" id="map-eyebrow">FLOOR MAP</span>
            <h2 id="map-title">Wybierz piętro</h2>
          </div>
          <div class="stats" id="map-stats"></div>
        </div>

        <div class="legend mono" aria-label="Legenda">
          <span><i class="dot dot--free"></i>WOLNE</span>
          <span><i class="dot dot--occupied"></i>ZAJĘTE</span>
          <span><i class="dot dot--maintenance"></i>KONSERWACJA / W TOKU</span>
          <span><i class="dot dot--selected"></i>ZAZNACZONE</span>
          <span><i class="dot dot--mine"></i>MOJE</span>
        </div>

        <div class="map-body" id="map-body"></div>
      </section>

      <!-- Panel prawy: szczegóły biurka (drawer) -->
      <div class="drawer-wrap" id="drawer-wrap">
        <aside class="panel drawer" id="drawer" aria-label="Szczegóły stanowiska" aria-hidden="true">
          <div class="panel__head">
            <div>
              <span class="eyebrow mono">DESK TELEMETRY</span>
              <h2 class="panel__title">STANOWISKO</h2>
            </div>
            <button type="button" class="icon-btn" id="drawer-close" aria-label="Zamknij panel szczegółów">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </div>
          <div class="drawer__body" id="drawer-body"></div>
        </aside>
      </div>
    </main>

    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
