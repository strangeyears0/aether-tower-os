apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true   # nginx-unprivileged działa jako uid 101
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: frontend }
      containers:
        - name: frontend
          image: aether-tower/frontend
          ports:
            - name: http
              containerPort: 8080
          env:
            # nginx.conf (envsubst) kieruje /api/* do tej usługi – nazwa DNS z tego samego namespace'u.
            - name: API_UPSTREAM
              value: http://reservation-service:8000
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
---
# Publiczny punkt wejścia: Service typu LoadBalancer tworzy w AWS Network Load Balancer
# w podsieciach publicznych (otagowanych kubernetes.io/role/elb w vpc.tf).
# Nie wymaga instalowania AWS Load Balancer Controller.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
