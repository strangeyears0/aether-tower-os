# Deployment BEZ pola `replicas` – liczbą replik zarządza HPA (hpa.yaml).
# Gdyby `replicas` było tutaj, każdy `kubectl apply` (czyli każdy deploy z CodeBuild)
# resetowałby skalowanie wykonane przez autoskaler.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation-service
  labels:
    app: reservation-service
spec:
  selector:
    matchLabels:
      app: reservation-service
  # Zero-downtime rolling update: nowy pod musi być Ready, zanim stary zostanie zabity.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: reservation-service
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: reservation-service }
      containers:
        - name: reservation-service
          image: aether-tower/reservation-service   # nazwa/tag podmieniane przez kustomization.yaml
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: aether-config, key: DB_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: aether-config, key: DB_PORT } }
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: aether-config, key: DB_NAME } }
            - name: DB_USER
              valueFrom: { configMapKeyRef: { name: aether-config, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: password } }
            - name: OFFICE_TIMEZONE
              valueFrom: { configMapKeyRef: { name: aether-config, key: OFFICE_TIMEZONE } }
            - name: NOTIFICATION_SERVICE_URL
              value: http://user-notification-service:8001
            # Frontend woła API przez ten sam host (nginx /api/ -> reverse proxy), więc CORS niepotrzebny.
            - name: CORS_ORIGINS
              value: ""
          resources:
            # Niskie requests są celowe: 50% z 100m = 50m, więc HPA reaguje już przy niewielkim ruchu.
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          # init_db() czeka na bazę do 30 x 2 s – startupProbe daje na to czas
          # i wstrzymuje liveness/readiness do pierwszego sukcesu.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:     # sprawdza połączenie z bazą (SELECT 1) – pod bez bazy nie dostaje ruchu
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # Pozwala endpointom zniknąć z Service zanim proces dostanie SIGTERM (brak zerwanych żądań).
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
---
apiVersion: v1
kind: Service
metadata:
  name: reservation-service
  labels:
    app: reservation-service
spec:
  selector:
    app: reservation-service
  ports:
    - name: http
      port: 8000
      targetPort: http
