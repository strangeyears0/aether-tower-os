name: aether-tower-os

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-aether_tower}
  DB_USER: ${DB_USER:-aether}
  DB_PASSWORD: ${DB_PASSWORD:-aether_dev_password}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-aether_tower}
      POSTGRES_USER: ${DB_USER:-aether}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aether_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  user-notification-service:
    build: ./application/user-notification-service
    image: aether-tower/user-notification-service:local
    restart: unless-stopped
    ports:
      - "${NOTIFICATION_HOST_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  reservation-service:
    build: ./application/reservation-service
    image: aether-tower/reservation-service:local
    restart: unless-stopped
    environment:
      <<: *db-env
      NOTIFICATION_SERVICE_URL: http://user-notification-service:8001
      OFFICE_TIMEZONE: ${OFFICE_TIMEZONE:-Europe/Warsaw}
      CORS_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      user-notification-service:
        condition: service_healthy
    ports:
      - "${RESERVATION_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 10

  # Jednorazowe zasilenie bazy (15 000 stanowisk + rezerwacje na dziś). Idempotentne.
  seed:
    build: ./application/reservation-service
    image: aether-tower/reservation-service:local
    command: ["python", "/scripts/seed.py"]
    restart: "no"
    environment:
      <<: *db-env
      OFFICE_TIMEZONE: ${OFFICE_TIMEZONE:-Europe/Warsaw}
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      reservation-service:
        condition: service_healthy

  frontend:
    build: ./application/frontend
    image: aether-tower/frontend:local
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://reservation-service:8000
    depends_on:
      reservation-service:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:8080"

volumes:
  pgdata:
